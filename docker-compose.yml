services:
  postgres:
    image: postgres:16-alpine
    container_name: galla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: galla
      POSTGRES_USER: galla
      POSTGRES_PASSWORD: galla123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galla -d galla"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: galla-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://galla:galla123@postgres:5432/galla?schema=public
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      MAIL_TO: ${MAIL_TO:-minetamexhiti01@gmail.com}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    container_name: galla-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
